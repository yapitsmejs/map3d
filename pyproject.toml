[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "map3d"
version = "0.1.0"
description = "Build offline, georeferenced 3D scene grids and 3D Tiles meshes from open data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yap Joon Siong" }]
dependencies = [
    "numpy>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "shapely>=2.0",
    "pyarrow>=16",
    "numba>=0.60",
    "typer>=0.12",
    "pygltflib>=1.16",
]

[project.optional-dependencies]
# Network-only tooling for `map3d prepare`; never needed on the air-gapped box.
prepare = [
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
    "hypothesis>=6",
    "httpx>=0.27",  # prepare's HTTP layer is unit-tested with mocked transports
]

[project.scripts]
map3d = "map3d.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/map3d"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# N (pep8-naming) is deliberately excluded so camelCase functions/variables
# are not flagged -- see CONVENTIONS.md "Naming conventions".
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.format]
# Match .editorconfig / .gitattributes so the formatter and editors agree on
# line endings across platforms.
line-ending = "lf"

[tool.mypy]
# Enforces the "type hints required on public functions" rule from
# CONVENTIONS.md. Scoped to the shipped package; tests are not type-checked.
files = ["src/map3d"]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
show_error_codes = true

# These ship no type information usable under strict mypy.
[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*", "pyarrow", "pyarrow.*", "shapely", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Strict, cheap, always on. Coverage is NOT measured here so the dev loop
# (`uv run pytest`) stays fast and does not fail during red-phase work; the
# coverage threshold is enforced by `scripts/check.py` instead.
addopts = ["--strict-markers", "--strict-config", "-ra"]